    padding: 2px 8px;
    border-radius: 12px;

// Collect all unique tags
const allTags = [...new Set(videos.flatMap(v => v.tags))].sort();

let activeTag = null;
let searchQuery = '';

function renderTags() {
  const container = document.getElementById('tags');
  const allBtn = document.createElement('button');
  allBtn.className = 'tag-btn' + (activeTag === null ? ' active' : '');
  allBtn.textContent = 'Все';
  allBtn.onclick = () => { activeTag = null; render(); };
  container.appendChild(allBtn);

  allTags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn' + (activeTag === tag ? ' active' : '');
    btn.textContent = tag;
    btn.onclick = () => { activeTag = tag === activeTag ? null : tag; render(); };
    container.appendChild(btn);
  });
}

function filterVideos() {
  const q = searchQuery.toLowerCase();
  return videos.filter(v => {
    const matchTag = !activeTag || v.tags.includes(activeTag);
    const matchSearch = !q ||
      v.title.toLowerCase().includes(q) ||
      v.channel.toLowerCase().includes(q) ||
      v.ideas.some(i => i.toLowerCase().includes(q));
    return matchTag && matchSearch;
  });
}

function render() {
  // Update tag buttons
  document.querySelectorAll('.tag-btn').forEach((btn, i) => {
    if (i === 0) {
      btn.className = 'tag-btn' + (activeTag === null ? ' active' : '');
    } else {
      const tag = allTags[i - 1];
      btn.className = 'tag-btn' + (activeTag === tag ? ' active' : '');
    }
  });

  const filtered = filterVideos();
  document.getElementById('count').textContent = `${filtered.length} из ${videos.length} видео`;

  const container = document.getElementById('cards');
  container.innerHTML = '';

  filtered.forEach(v => {
    const card = document.createElement('div');
    card.className = 'card';

    const ideas = v.ideas.map(i => `<li>${i}</li>`).join('');
    const tags = v.tags.map(t =>
      `<span class="card-tag" onclick="filterByTag('${t}')">#${t}</span>`
    ).join('');

    const transcriptBtn = v.transcript
      ? `<a class="btn btn-md" href="${v.transcript}">Транскрипт</a>`
      : '';

    card.innerHTML = `
      <div class="card-header">
        <span class="lang-badge lang-${v.lang.toLowerCase()}">${v.lang}</span>
        <div class="card-title">${v.title}</div>
      </div>
      <div class="card-meta">
        <span>${v.channel}</span><span>${v.date}</span>
      </div>
      <ul class="ideas">${ideas}</ul>
      <div class="card-tags">${tags}</div>
      <div class="card-actions">
        <a class="btn btn-yt" href="${v.url}" target="_blank">YouTube</a>
        ${transcriptBtn}
      </div>
    `;
    container.appendChild(card);
  });
}

function filterByTag(tag) {
  activeTag = tag === activeTag ? null : tag;
  render();
}

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

renderTags();
render();
</script>
